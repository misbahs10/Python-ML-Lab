[project]
name = "ai_research"
version = "0.1.0"
description = "Multi-agent AI research and report generation system using CrewAI"
authors = [{ name = "Misbah Sajjad", email = "misbahsajjad2006@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.14,<2.0.0"
]

[project.scripts]
ai_research = "ai_research.main:run"
run_crew = "ai_research.main:run"
train = "ai_research.main:train"
replay = "ai_research.main:replay"
test = "ai_research.main:test"
run_with_trigger = "ai_research.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "67f178b5-08d0-4f8a-9685-a71503914a0c"